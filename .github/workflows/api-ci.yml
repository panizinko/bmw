name: API CI Pipeline

on:
  push:
      branches:
        - main
        - develop
      paths:
        - 'budget-manager-api/**'
        - '.github/workflows/api-ci.yml'
  pull_request:
      branches:
        - main
        - develop



jobs:
  lint-and-test-api:
    runs-on: ubuntu-latest
    environment: test

    env:
      POSTGRES_USER: ${{ secrets.TEST_DB_USER }}
      POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
      POSTGRES_DB: ${{ secrets.TEST_DB_NAME }}
      DATABASE_URL: "postgresql+psycopg://${{ secrets.TEST_DB_USER }}:${{ secrets.TEST_DB_PASSWORD }}@localhost:5432/${{ secrets.TEST_DB_NAME }}"
      PYTHON_VERSION: '3.13'
      SECRET_KEY_CI: ${{ secrets.TEST_SECRET_KEY }}
      IN_PRODUCTION: false
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      ACCESS_TOKEN_COOKIE_NAME: "access_token"
      REFRESH_TOKEN_COOKIE_NAME: "refresh_token"

    defaults:
      run:
        working-directory: ./budget-manager-api

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Install dependencies
        run: poetry install

      - name: Run database migrations
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: poetry run alembic upgrade head

      - name: Run linter
        run: poetry run poe lint

      - name: Run tests
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SECRET_KEY: ${{ env.SECRET_KEY_CI }}
          ALGORITHM: ${{ env.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ env.ACCESS_TOKEN_EXPIRE_MINUTES }}
          REFRESH_TOKEN_EXPIRE_DAYS: ${{ env.REFRESH_TOKEN_EXPIRE_DAYS }}
          ACCESS_TOKEN_COOKIE_NAME: ${{ env.ACCESS_TOKEN_COOKIE_NAME }}
          REFRESH_TOKEN_COOKIE_NAME: ${{ env.REFRESH_TOKEN_COOKIE_NAME }}
          IN_PRODUCTION: ${{ env.IN_PRODUCTION }}
        run: poetry run poe test